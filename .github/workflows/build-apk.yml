name: Build Android APK (TOTALHIIT)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Ejecutar pruebas Vitest
        run: npm test

      - name: Construir aplicación web y sincronizar con Capacitor
        run: npm run cap:copy

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK (Release / Debug)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: totalhiit-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
